[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muku"
version = "0.2.1"
description = "Muku turns knowledge-heavy video links and local audio into Markdown transcript and knowledge-base assets."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Qianzhu", email = "2729478828@qq.com" },
]
keywords = ["video", "transcript", "markdown", "knowledge-base", "yt-dlp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Framework :: Flask",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "Flask>=3.0,<4",
  "requests>=2.32,<3",
  "aiohttp>=3.10,<4",
  "gmssl>=3.2.2",
  "yt-dlp>=2024.10.0",
  "click>=8.1,<9",
]

[project.scripts]
muku = "webui.cli:main"
video-downloade = "webui.cli:main"

[project.urls]
Homepage = "https://github.com/qianzhu18/Muku"
Documentation = "https://github.com/qianzhu18/Muku/blob/main/docs/cli.md"
Issues = "https://github.com/qianzhu18/Muku/issues"
Source = "https://github.com/qianzhu18/Muku"

[tool.setuptools]
packages = ["webui"]
include-package-data = false

[tool.setuptools.package-data]
webui = [
  "static/*.css",
  "static/*.js",
  "templates/*.html",
  "prompts/*.md",
]
