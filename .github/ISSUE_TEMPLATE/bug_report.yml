name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请删除 API Key、Cookies、私人链接和本地敏感路径后再提交。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？你期望发生什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      placeholder: |
        1. 安装版本...
        2. 运行命令...
        3. 看到错误...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python、Docker、Muku 版本，以及已脱敏的 doctor 相关字段。
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先移除密钥、Cookies、私人内容和敏感路径。
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题
          required: true
        - label: 我没有提交 API Key、Cookies 或私人内容
          required: true
        - label: 这不是尚未修复的安全漏洞
          required: true
