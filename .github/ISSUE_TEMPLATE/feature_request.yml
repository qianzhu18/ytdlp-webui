name: Feature request
description: 提议新的输入、工作流或体验改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 你要解决的问题
      description: 请描述真实工作流，而不只是功能名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 输入是什么、期望产物是什么、由 CLI/Web/Docker/Skill 哪个入口承载？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你现在如何解决？有哪些取舍？
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue 和路线文档
          required: true
        - label: 该需求遵守目标平台规则和版权要求
          required: true
